name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "kalila-dimna"

jobs:
  validate:
    name: Validate stories
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: godot --headless --editor --quit

      - name: Validate story data
        run: godot --headless --path . -s tests/validate_stories.gd

      - name: Validate animal mappings
        run: godot --headless --path . -s tests/validate_animals.gd

      - name: Validate required real animal assets
        run: godot --headless --path . -s tests/validate_animal_assets.gd

      - name: Validate story 3D environments
        run: godot --headless --path . -s tests/validate_story_environments.gd

      - name: Validate lion bull 2D story stage
        run: godot --headless --path . -s tests/validate_story_2d.gd

  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot Android environment
        run: |
          set -eux
          echo "HOME=$HOME"
          godot --version
          mkdir -p "$HOME/.local/share/godot/export_templates"
          mkdir -p "$HOME/.config"
          if [ -d /root/.config/godot ] && [ "/root/.config/godot" != "$HOME/.config/godot" ]; then
            cp -a /root/.config/godot/. "$HOME/.config/godot/"
          fi

          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          mkdir -p "$TEMPLATE_DIR"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ] || [ ! -f "$TEMPLATE_DIR/android_source.zip" ]; then
            rm -rf /tmp/godot-templates /tmp/godot-templates.tpz
            mkdir -p /tmp/godot-templates
            wget -q --show-progress --tries=3 -O /tmp/godot-templates.tpz "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
            unzip -q /tmp/godot-templates.tpz -d /tmp/godot-templates
            rm -rf "$TEMPLATE_DIR"
            mkdir -p "$TEMPLATE_DIR"
            cp -a /tmp/godot-templates/templates/. "$TEMPLATE_DIR/"
          fi

          # Godot requires the version marker and all Android templates used by
          # Gradle exports. The preset uses Gradle, so android_source.zip is
          # required in addition to android_debug.apk.
          printf '%s\n' "${GODOT_VERSION}.stable" > "$TEMPLATE_DIR/version.txt"

          if [ ! -f "$TEMPLATE_DIR/android_debug.apk" ] || [ ! -f "$TEMPLATE_DIR/android_source.zip" ]; then
            echo "ERROR: Required Godot Android export templates are missing"
            find "$HOME/.local/share/godot/export_templates" -maxdepth 3 -type f -print || true
            exit 1
          fi

          echo "Installed Android export templates:"
          ls -lah "$TEMPLATE_DIR"

          if [ -f "$HOME/.config/godot/editor_settings-4.3.tres" ]; then
            printf '\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\n' >> "$HOME/.config/godot/editor_settings-4.3.tres"
          fi

      - name: Export Android Debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/${EXPORT_NAME}-debug.apk"

      - name: Verify required resources are embedded in APK
        run: |
          set -eux
          APK="build/android/${EXPORT_NAME}-debug.apk"
          test -s "$APK"
          # The Godot PCK stores resource paths as plain bytes. Avoid relying on
          # python3/strings inside the minimal Godot CI container.
          for resource in \
            "lion.glb" "bull.glb" "crow.glb" "snake.glb" \
            "monkey.glb" "turtle.glb" "dove.gltf" "hare.glb"; do
            if ! grep -a -q "$resource" "$APK"; then
              echo "ERROR: required animal resource is not embedded in exported APK/PCK: $resource"
              exit 1
            fi
          done

          # Realistic 2D characters are a release requirement. Check both the
          # source tree and the exported PCK path so a missing/import-failed
          # WebP cannot silently ship.
          for resource in \
            "lion_2d_realistic.webp" "bull_2d_realistic.webp" \
            "crow_realistic.webp" "snake_realistic.webp" \
            "monkey_realistic.webp" "turtle_realistic.webp" \
            "dove_realistic.webp" "mouse_realistic.webp" \
            "hare_realistic.webp"; do
            test -s "assets/images/characters/$resource"
            if ! grep -a -q "$resource" "$APK"; then
              echo "ERROR: realistic 2D character is not embedded in exported APK/PCK: $resource"
              exit 1
            fi
          done
          echo "All required animal and realistic 2D character resources are embedded in the APK/PCK"

          # Realistic 2D story backgrounds are also release requirements.
          for resource in \\
            "lion_bull_forest_realistic.webp" "lion_bull_river_meadow_realistic.webp" \\
            "crow_snake_forest_realistic.webp" "monkey_turtle_river_realistic.webp" \\
            "dove_ring_forest_realistic.webp" "lion_hare_forest_realistic.webp" \\
            "lion_hare_well_realistic.webp"; do
            test -s "assets/images/backgrounds/$resource"
            if ! grep -a -q "$resource" "$APK"; then
              echo "ERROR: realistic 2D story background is not embedded in exported APK/PCK: $resource"
              exit 1
            fi
          done
          echo "All required realistic 2D story backgrounds are embedded in the APK/PCK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalila-dimna-debug-apk
          path: build/android/kalila-dimna-debug.apk
          if-no-files-found: error
