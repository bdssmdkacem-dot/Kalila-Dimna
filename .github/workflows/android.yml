name: Godot CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "kalila-dimna"

jobs:
  validate:
    name: Validate stories
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi

      - name: Import project
        run: godot --headless --editor --quit

      - name: Validate story data
        run: godot --headless --path . -s tests/validate_stories.gd

      - name: Validate animal mappings
        run: godot --headless --path . -s tests/validate_animals.gd

  android-debug:
    name: Android Debug APK
    runs-on: ubuntu-24.04
    container:
      image: barichello/godot-ci:4.3
    needs: validate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Prepare Godot Android environment
        run: |
          mkdir -p ~/.local/share/godot/export_templates
          mkdir -p ~/.config
          if [ -d /root/.config/godot ]; then
            mv /root/.config/godot ~/.config/godot
          fi
          if [ -d "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ]; then
            mv "/root/.local/share/godot/export_templates/${GODOT_VERSION}.stable" ~/.local/share/godot/export_templates/
          fi
          if [ -f ~/.config/godot/editor_settings-4.3.tres ]; then
            printf '\nexport/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"\n' >> ~/.config/godot/editor_settings-4.3.tres
          fi

      - name: Export Android Debug APK
        run: |
          mkdir -p build/android
          godot --headless --verbose --path . --export-debug "Android Debug" "build/android/${EXPORT_NAME}-debug.apk"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: kalila-dimna-debug-apk
          path: build/android/kalila-dimna-debug.apk
          if-no-files-found: error
